name: postgres-cluster

services:
  postgres-primary:
    image: postgres:18
    container_name: postgres-primary
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: labdb
      POSTGRES_TDUNPHY_PASSWORD: ${POSTGRES_TDUNPHY_PASSWORD}
      POSTGRES_BLUETHUNDR_PASSWORD: ${POSTGRES_BLUETHUNDR_PASSWORD}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    ports:
      - "55432:5432"
    volumes:
      - ./data/primary:/var/lib/postgresql
      - ./primary-init:/docker-entrypoint-initdb.d
      
  postgres-replica1:
    image: postgres:18
    container_name: postgres-replica1
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    ports:
      - "55433:5432"
    volumes:
      - ./data/replica1:/var/lib/postgresql
    depends_on:
      - postgres-primary
    command: >
      bash -c "
      rm -rf /var/lib/postgresql/18/docker/* &&
      gosu postgres pg_basebackup -h postgres-primary -p 5432 -D /var/lib/postgresql/18/docker -U replicator -Fp -Xs -P -R &&
      exec gosu postgres postgres -D /var/lib/postgresql/18/docker
      "

  postgres-replica2:
    image: postgres:18
    container_name: postgres-replica2
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    ports:
      - "55434:5432"
    volumes:
      - ./data/replica2:/var/lib/postgresql
    depends_on:
      - postgres-primary
    command: >
      bash -c "
      rm -rf /var/lib/postgresql/18/docker/* &&
      gosu postgres pg_basebackup -h postgres-primary -p 5432 -D /var/lib/postgresql/18/docker -U replicator -Fp -Xs -P -R &&
      exec gosu postgres postgres -D /var/lib/postgresql/18/docker
      "

  postgres-replica3:
    image: postgres:18
    container_name: postgres-replica3
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    ports:
      - "55435:5432"
    volumes:
      - ./data/replica3:/var/lib/postgresql
    depends_on:
      - postgres-primary
    command: >
      bash -c "
      rm -rf /var/lib/postgresql/18/docker/* &&
      gosu postgres pg_basebackup -h postgres-primary -p 5432 -D /var/lib/postgresql/18/docker -U replicator -Fp -Xs -P -R &&
      exec gosu postgres postgres -D /var/lib/postgresql/18/docker
      "